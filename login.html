<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ingresar · Marea</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="estilos.css" rel="stylesheet">
</head>
<body>

  <nav class="nav-marea">
    <div class="container d-flex justify-content-between align-items-center">
      <a class="marca" href="index.html">MAREA</a>
      <div class="nav-enlaces" id="menu"></div>
    </div>
  </nav>

  <main class="pagina">
    <div class="container">
      <div class="tarjeta tarjeta-angosta">
        <h1 class="pagina-titulo text-center mb-1">Bienvenido</h1>
        <p class="pagina-bajada text-center mb-4">Ingresá o creá tu cuenta para reservar.</p>

        <div class="pestanas">
          <button type="button" class="pestana activa" id="pestana-ingreso">Ingresar</button>
          <button type="button" class="pestana" id="pestana-registro">Crear cuenta</button>
        </div>

        <form id="form-ingreso">
          <div class="mb-3">
            <label class="form-label" for="ingreso-email">Correo</label>
            <input class="form-control" type="email" id="ingreso-email" required autocomplete="email">
          </div>
          <div class="mb-4">
            <label class="form-label" for="ingreso-clave">Contraseña</label>
            <input class="form-control" type="password" id="ingreso-clave" required autocomplete="current-password">
          </div>
          <button type="submit" class="btn-marea oscuro ancho">Ingresar</button>
          <div class="text-center mt-3">
            <button type="button" class="enlace-olvide" id="btn-olvide">¿Olvidaste tu contraseña?</button>
          </div>
        </form>

        <form id="form-recuperar" class="oculto">
          <p class="pagina-bajada mb-3">
            Escribí el correo de tu cuenta y te mandamos un enlace para crear una contraseña nueva.
          </p>
          <div class="mb-4">
            <label class="form-label" for="recuperar-email">Correo</label>
            <input class="form-control" type="email" id="recuperar-email" required autocomplete="email">
          </div>
          <button type="submit" class="btn-marea oscuro ancho">Enviar enlace</button>
          <div class="text-center mt-3">
            <button type="button" class="enlace-olvide" id="btn-volver-ingreso">Volver a ingresar</button>
          </div>
        </form>

        <form id="form-registro" class="oculto">
          <div class="mb-3">
            <label class="form-label" for="registro-nombre">Nombre</label>
            <input class="form-control" type="text" id="registro-nombre" required autocomplete="name">
          </div>
          <div class="mb-3">
            <label class="form-label" for="registro-email">Correo</label>
            <input class="form-control" type="email" id="registro-email" required autocomplete="email">
          </div>
          <div class="mb-3">
            <label class="form-label" for="registro-clave">Contraseña</label>
            <input class="form-control" type="password" id="registro-clave" required minlength="8"
                   pattern="(?=.*[A-Za-z])(?=.*[0-9]).{8,}" autocomplete="new-password">
            <div class="ayuda-campo">Mínimo 8 caracteres, con letras y números.</div>
          </div>
          <div class="form-check mb-4 consentimiento">
            <input class="form-check-input" type="checkbox" id="registro-privacidad" required>
            <label class="form-check-label" for="registro-privacidad">
              Leí y acepto la <a href="privacidad.html" target="_blank" rel="noopener">política de privacidad</a>.
            </label>
          </div>
          <button type="submit" class="btn-marea oscuro ancho">Crear cuenta</button>
        </form>

        <div id="aviso-login" class="oculto" role="alert"></div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="comun.js"></script>
  <script src="login.js"></script>
</body>
</html>

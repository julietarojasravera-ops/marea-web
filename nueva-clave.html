<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#081c30">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="icono-apple.png">
  <title>Nueva contraseña · Marea</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="estilos.css" rel="stylesheet">
</head>
<body>

  <nav class="nav-marea">
    <div class="container d-flex justify-content-between align-items-center">
      <a class="marca" href="index.html"><img class="marca-logo" src="logo-marea-claro.png" alt="Marea" width="640" height="203"></a>
      <div class="nav-enlaces" id="menu"></div>
    </div>
  </nav>

  <main class="pagina-foto foto-ventanal">
    <div class="container">
      <div class="tarjeta tarjeta-angosta tarjeta-vidrio">
        <h1 class="pagina-titulo text-center mb-1">Nueva contraseña</h1>
        <p class="pagina-bajada text-center mb-4" id="bajada">Un momento…</p>

        <form id="form-nueva" class="oculto">
          <div class="mb-3">
            <label class="form-label" for="nueva-clave">Contraseña nueva</label>
            <input class="form-control" type="password" id="nueva-clave" required minlength="8" autocomplete="new-password">
            <div class="ayuda-campo">Mínimo 8 caracteres, con letras y números.</div>
          </div>
          <div class="mb-4">
            <label class="form-label" for="nueva-clave-2">Repetila</label>
            <input class="form-control" type="password" id="nueva-clave-2" required minlength="8" autocomplete="new-password">
          </div>
          <button type="submit" class="btn-marea oscuro ancho">Guardar contraseña</button>
        </form>

        <div id="sin-enlace" class="oculto text-center">
          <a class="btn-marea oscuro" href="login.html?modo=recuperar">Pedir un enlace nuevo</a>
        </div>

        <div id="aviso-nueva" class="oculto" role="alert"></div>
      </div>
    </div>
  </main>

  <footer class="pie-marea pie-simple">
    <div class="container">
      <div class="pie-final">
        <span>© Marea · Cocina de mar · Costa atlántica uruguaya</span>
        <a class="pie-enlace" href="privacidad.html">Política de privacidad</a>
      </div>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="comun.js"></script>
  <script src="nueva-clave.js"></script>
</body>
</html>

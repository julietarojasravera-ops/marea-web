<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reservar · Marea</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="estilos.css" rel="stylesheet">
</head>
<body>

  <nav class="nav-marea">
    <div class="container d-flex justify-content-between align-items-center">
      <a class="marca" href="index.html">MAREA</a>
      <div class="nav-enlaces" id="menu"></div>
    </div>
  </nav>

  <main class="pagina">
    <div class="container">
      <div class="tarjeta tarjeta-media">
        <h1 class="pagina-titulo mb-1">Reservá tu mesa</h1>
        <p class="pagina-bajada mb-4"><span id="saludo"></span> Elegí día, hora y cuántos son. Cada reserva es por 2 horas.</p>

        <form id="form-buscar">
          <div class="row g-3">
            <div class="col-md-5">
              <label class="form-label" for="fecha">Día</label>
              <input class="form-control" type="date" id="fecha" required>
            </div>
            <div class="col-6 col-md-3">
              <label class="form-label" for="hora">Hora</label>
              <select class="form-select" id="hora" required></select>
            </div>
            <div class="col-6 col-md-4">
              <label class="form-label" for="personas">Personas</label>
              <select class="form-select" id="personas" required></select>
            </div>
          </div>
          <button type="submit" class="btn-marea oscuro mt-4">Ver disponibilidad</button>

          <div id="resultado" class="resultado oculto">
            <h3>¡Hay mesa!</h3>
            <p id="resultado-texto" class="mb-3"></p>
            <button type="button" class="btn-marea" id="btn-confirmar">Confirmar reserva</button>
          </div>
        </form>

        <div id="confirmacion" class="oculto">
          <div class="resultado">
            <h3>Reserva confirmada</h3>
            <p id="confirmacion-texto" class="mb-0"></p>
          </div>
          <div class="d-flex gap-3 flex-wrap mt-4">
            <a class="btn-marea oscuro" href="mis-reservas.html">Ver mis reservas</a>
            <a class="btn-marea" href="reservar.html">Hacer otra reserva</a>
          </div>
        </div>

        <div id="aviso-reserva" class="oculto" role="alert"></div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="comun.js"></script>
  <script src="reservar.js"></script>
</body>
</html>
